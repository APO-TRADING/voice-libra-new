// piper-tts native module for Android.
//
// ITERATION 2 (CURRENT): Microsoft ONNX Runtime + espeak-ng (compiled
// from source via NDK + CMake). Provides full prosody, intonation, and
// per-language dictionaries (it, en, es, fr, de) backed by the real
// espeak-ng phoneme tables. The Kotlin ItalianPhonemizer.kt is kept
// as a fallback if the native .so fails to load on a given device.
//
// Build time impact: ~8-12 extra minutes on first EAS build (espeak-ng
// source is fetched via FetchContent then compiled per ABI). Subsequent
// builds reuse the CMake cache when CI honors it.
//
// To disable native compilation (returns to ITERATION 1 dictionary-only
// behavior, ~12 min faster build) pass `-PwithNativePhonemizer=false`.

buildscript {
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : "2.0.21"
  repositories { google(); mavenCentral() }
  dependencies {
    classpath "com.android.tools.build:gradle:8.6.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// Default ON: compile espeak-ng from source via NDK + CMake. Use the
// Gradle property `-PwithNativePhonemizer=false` to fall back to the
// Kotlin Italian-only dictionary phonemizer (faster builds, but no
// real prosody / intonation curves / multi-language support).
def withNativePhonemizer = (project.findProperty('withNativePhonemizer') ?: 'true') == 'true'

android {
  namespace "com.beppeaudiobooks.pipertts"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)

    if (withNativePhonemizer) {
      ndk {
        abiFilters "arm64-v8a", "armeabi-v7a"
      }
      externalNativeBuild {
        cmake {
          cppFlags "-std=c++17 -fexceptions -frtti -O2"
          arguments "-DANDROID_STL=c++_shared",
                    "-DANDROID_PLATFORM=android-24"
        }
      }
    }
  }

  if (withNativePhonemizer) {
    externalNativeBuild {
      cmake {
        path "src/main/cpp/CMakeLists.txt"
        version "3.22.1"
      }
    }
  }

  buildTypes {
    release { minifyEnabled false }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }
  lintOptions { disable "GradleCompatible" }
  packagingOptions {
    jniLibs {
      pickFirsts += ["**/libc++_shared.so"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Microsoft ONNX Runtime for Android — official Maven release. Supports
  // FP32, FP16, INT8 models natively via its kernel set.
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.19.2"

  // AndroidX core (used for general Kotlin extensions). Lockscreen + media
  // notification is owned by expo-audio now; no MediaSessionCompat needed.
  implementation "androidx.core:core-ktx:1.13.1"

  // Kotlin coroutines for the synthesize() async pipeline.
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
